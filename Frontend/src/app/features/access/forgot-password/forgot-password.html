@if (pageReady()){
<div class="container">
  <div class="card">
    <div class="header">
      <app-icon class="icon-button" src="assets/icons/arrow-back.svg" (click)="onBack()" tabindex="0">
      </app-icon>
      <h2>{{ 'ACCESS.FORGOT_PASSWORD.TITLE' | translate }}</h2>
    </div>
    <p class="subtitle">{{ 'ACCESS.FORGOT_PASSWORD.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ 'ACCESS.COMMON.EMAIL_LABEL' | translate }}</label>
        <input type="email" [(ngModel)]="email" name="email"
          [placeholder]="'ACCESS.COMMON.EMAIL_PLACEHOLDER' | translate" required (ngModelChange)="resetMessages()" />
      </div>

      <button class="btn-primary btn-wide" type="submit" [disabled]="!email || isLoading" [class.loading]="isLoading">
        {{
        'ACCESS.FORGOT_PASSWORD.BUTTON' |
        translate }}</button>
    </form>

    <p class="message success collapsible" [class.collapse]="!message()">{{ message() }}</p>
    <p class="message error collapsible" [class.collapse]="!error()">{{ error() }}</p>

  </div>
</div>
}
@else{
<div class="container">
  <div class="card">
    <div class="global-loader-overlay">
      <div class="global-spinner" aria-hidden="true"></div>
    </div>
  </div>
</div>
}
