name: Atomic Production Deploy

on:
  push:
    branches:
      - main # Triggers when you push to main

jobs:
  # 1. BUILD FRONTEND (Safety Check)
  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        run: |
          npm ci
          npm run build --configuration production

  # 2. BUILD BACKEND (Safety Check)
  build-backend:
    name: Build C# Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build & Test
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          # If you run C# unit tests, put the command here!

  # 3. THE TRAFFIC COP (Deploy Phase)
  deploy-everything:
    name: Sync Deploy
    runs-on: ubuntu-latest
    # WAITS FOR BOTH TO PASS: If C# or Angular fails to compile above, this cancels.
    needs: [build-frontend, build-backend] 
    steps:
      - uses: actions/checkout@v4
      
      # 3a. Install Railway CLI
      - name: Install Railway CLI
        run: npm i -g @railway/cli
        
      # 3b. Deploy to Railway
      # This command blocks and waits for Railway to finish deploying.
      # If Railway crashes or fails to start, the action fails here!
      - name: Deploy C# to Railway
        run: railway up --service besilent
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        
      # 3c. Deploy to Vercel
      # This ONLY runs if the Railway step above finishes perfectly.
      - name: Deploy Angular to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
