<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <style>
        /* Dark Mode Override */
        @media (prefers-color-scheme: dark) {

            .box,
            .check {
                stroke: #f8f7f5;
            }

            .dot {
                fill: #f8f7f5;
            }
        }
    </style>

    <!-- The Box (Width back to 6 so it doesn't vanish at 16px) -->
    <rect class="box" x="14" y="13" width="38" height="38" stroke="#111111" stroke-linecap="square"
        stroke-linejoin="miter" fill="none" stroke-width="4" />

    <!-- The Checkmark (Fixed stroke-linecap) -->
    <!--<polyline class="check" points="20,30 30,40 55,15" stroke="#111111" stroke-linecap="square" stroke-linejoin="miter"
        fill="none" stroke-width="8" /> -->


    <path class="check" fill="none" stroke-width="9" stroke-linecap="square" stroke-linejoin="square" stroke="#111111"
        d="M12 7 L53 45 M12 57 L53 19"></path>
</svg>