<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="forgot-password-header">
      <a routerLink="/login" class="back-link" [attr.aria-label]="'ACCESS.FORGOT_PASSWORD.BACK_TO_LOGIN' | translate">←</a>
      <h2>{{ 'ACCESS.FORGOT_PASSWORD.TITLE' | translate }}</h2>
      <div></div>
    </div>
    <p class="subtitle">{{ 'ACCESS.FORGOT_PASSWORD.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label>{{ 'ACCESS.FORGOT_PASSWORD.EMAIL_LABEL' | translate }}</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'ACCESS.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          required
        />
      </div>

      <button type="submit" [disabled]="!email">{{ 'ACCESS.FORGOT_PASSWORD.BUTTON' | translate }}</button>
    </form>

    @if (message) {
      <p class="message success">{{ message }}</p>
    }
    @if (error) {
      <p class="message error">{{ error }}</p>
    }
  </div>
</div>
