name: Atomic Production Deploy

on:
  push:
    branches:
      - main # Triggers when you push to main

jobs:
  # 1. BUILD FRONTEND (Safety Check)
  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install & Build
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build
          npm run test -- --watch=false --browsers=chromium --no-progress --coverage

  # 2. BUILD BACKEND (Safety Check)
  build-backend:
    name: Build C# Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build & Test
        # Tell GitHub to run these commands inside the Backend folder
        working-directory: ./Backend
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release --logger "console;verbosity=detailed"

  # 3. THE TRAFFIC COP (Deploy Phase)
  deploy-everything:
    name: Sync Deploy
    runs-on: ubuntu-latest
    # WAITS FOR BOTH TO PASS: If C# or Angular fails to compile above, this cancels.
    needs: [build-frontend, build-backend] 
    steps:
      - uses: actions/checkout@v5
      
      # 3a. Install Railway CLI
      - name: Install Railway CLI
        run: npm i -g @railway/cli
        
      # 3b. Deploy to Railway
      # This command blocks and waits for Railway to finish deploying.
      # If Railway crashes or fails to start, the action fails here!
      - name: Deploy C# to Railway
        run: railway up --service besilent
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # 3c. Deploy to Vercel using the official CLI
      - name: Deploy Angular to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
