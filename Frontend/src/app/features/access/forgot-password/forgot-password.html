<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email and we’ll send you a secure reset link.</p>

    <form (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="name@pl-partners.dk"
          required
        />
      </div>

      <button type="submit" [disabled]="!email">Send Reset Link</button>
    </form>

    @if (message) {
      <p class="message success">{{ message }}</p>
    }
    @if (error) {
      <p class="message error">{{ error }}</p>
    }
  </div>
</div>
