    <div style="max-width: 400px; margin: 2rem auto; text-align: center;">
      <h2>Set New Password</h2>

      <form (ngSubmit)="onSubmit()">
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="password"
          placeholder="New password (min 6 characters)"
          required
          style="padding: 0.5rem; width: 100%; margin-bottom: 1rem;"
        />
        <button type="submit" style="padding: 0.5rem 1rem; width: 100%;">Save Password</button>
      </form>

      @if (message) {
        <p style="color: var(--success-color); margin-top: 1rem;">{{ message }}</p>
      }

      @if (error) {
        <p style="color: var(--error-color); margin-top: 1rem;">{{ error }}</p>
      }
    </div>
