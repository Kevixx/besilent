<div class="update-password-container">
  <div class="update-password-card">
    <!-- ERROR MODE: Show this if the link is expired/invalid -->
    @if (hasError) {
      <h2>Link Expired</h2>
      <p class="message error">
        {{ errorMessage }}
      </p>
      <a class="link-button" routerLink="/forgot-password">
        Request New Link
      </a>
    }
    <!-- NORMAL MODE: Show the form if the link is valid -->
    @else {
      <h2>Set New Password</h2>
      <p class="subtitle">Enter your new secure password below.</p>

      <form (ngSubmit)="onSubmit()" class="update-password-form">
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            name="password"
            placeholder="New password (min 6 characters)"
            required
          />
        </div>

        <button type="submit" [disabled]="!newPassword">Save Password</button>
      </form>

      @if (message) {
        <p class="message success">{{ message }}</p>
      }
      @if (submitError) {
        <p class="message error">{{ submitError }}</p>
      }
    }
  </div>
</div>
