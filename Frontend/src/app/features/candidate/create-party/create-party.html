@if(pageReady()) {
<div class="container">
    <div class="card">
        <div class="header">
            <h2>{{ 'CANDIDATE.CREATE_PARTY.TITLE' | translate }}</h2>
            <app-icon class="icon-button" src="assets/icons/close.svg" (click)="onClose()" tabindex="0"></app-icon>
        </div>
        <p class="subtitle">{{ 'CANDIDATE.CREATE_PARTY.SUBTITLE' | translate }}</p>

        <form [formGroup]="partyForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label>{{ 'CANDIDATE.CREATE_PARTY.NAME_LABEL' | translate }}</label>
                <input type="text" formControlName="name"
                    [placeholder]="'CANDIDATE.CREATE_PARTY.NAME_PLACEHOLDER' | translate" required />
                <small class="message error collapsible"
                    [class.collapse]="!partyForm.controls.name.hasError('minlength')">
                    {{ 'CANDIDATE.CREATE_PARTY.NAME_LENGTH_ERROR' | translate }}
                </small>
            </div>

            <div class="form-group">
                <label>{{ 'CANDIDATE.CREATE_PARTY.DESCRIPTION_LABEL' | translate }}</label>
                <textarea formControlName="description" rows="5"
                    [placeholder]="'CANDIDATE.CREATE_PARTY.DESCRIPTION_PLACEHOLDER' | translate" required>
                </textarea>

                <small class="message error collapsible"
                    [class.collapse]="!partyForm.controls.description.hasError('minlength')">
                    {{ 'CANDIDATE.CREATE_PARTY.DESCRIPTION_LENGTH_ERROR' | translate }}
                </small>
            </div>

            <button type="submit" [disabled]="partyForm.invalid || isLoading()" [class.loading]="isLoading()"
                class="btn-primary btn-wide" [class.loading]="isLoading()">
                {{ 'CANDIDATE.CREATE_PARTY.SUBMIT_BUTTON' | translate }}
            </button>
        </form>

        <p class="message error collapsible" [class.collapse]="!errorMessage()">{{ errorMessage() }}</p>
    </div>
</div>
}
@else{
<div class="container">
    <div class="card">
        <div class="global-loader-overlay">
            <div class="global-spinner" aria-hidden="true"></div>
        </div>
    </div>
</div>
}
